# Server Aurora in Docker: l'unico modo di installarlo su Linux.
# Con installa.sh si configura da solo; a mano: metti accanto un file .env
# (da env.example) e lancia "docker compose up -d".
services:
  aurora:
    image: ghcr.io/s1m0ne1997/aurora:latest
    container_name: aurora
    restart: unless-stopped
    network_mode: host          # niente NAT di Docker sull'UDP: latenza e CPU minime
    env_file: .env
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

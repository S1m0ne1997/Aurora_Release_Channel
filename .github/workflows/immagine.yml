# Costruisce l'immagine Docker del server (ghcr.io/s1m0ne1997/aurora) quando
# cambiano Dockerfile o aurora.sh, oppure a mano da Actions.
name: Immagine Docker
on:
  push:
    branches: [main]
    paths: [Dockerfile, aurora.sh, .github/workflows/immagine.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  immagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/s1m0ne1997/aurora:latest

# Server Aurora per le interfacce dei NAS (ZimaOS, CasaOS, Portainer...):
# Importa -> Docker Compose. Modifica solo i valori di "environment".
name: aurora
services:
  aurora:
    image: ghcr.io/s1m0ne1997/aurora:latest
    container_name: aurora
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_IP: 192.168.1.5        # IP del server (in casa: quello locale del NAS)
      DOMAIN: ""                    # dominio, se c'è (porte 80 e 443)
      PORT: "8080"                  # porta HTTPS senza dominio
      UDP_PORT: "7882"              # audio
      ROOMS: Generale,Gaming,Musica,AFK
      AURORA_STATE_KEY: ""          # vuota = il server crea la chiave in data/state/key
    volumes:
      - /DATA/AppData/aurora:/data
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
x-casaos:
  architectures: [amd64, arm64]
  main: aurora
  title: { en_us: Aurora }
  category: Chat
  port_map: "8080"
  scheme: https
